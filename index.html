<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Title + description are hardcoded here (not pulled from src/config.js)
      because index.html is read by browsers/crawlers before React ever runs.
      If you reuse this site for a different salon, update these two tags
      AND src/config.js so they stay in sync.
    -->
    <title>Creature Comfort Shop | Dog Grooming in Riverside, CA</title>
    <meta
      name="description"
      content="Creature Comfort Shop is a friendly dog grooming shop in Riverside, CA. Grooming, baths and nail clipping — and your dog always has the same groomer."
    />

    <!-- Keep this site out of Google and other search engines. Also sent as an
         X-Robots-Tag header from public/_headers (Cloudflare Pages). -->
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
